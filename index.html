<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Tracker 2.0</title>
<meta name="theme-color" content="#f4ecdf" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workout 2.0">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Fonts are bundled (Latin subsets, SIL Open Font License) so the app looks the same offline. */
@font-face{font-family:'Barlow Condensed';src:url('fonts/barlow-condensed-Medium.woff') format('woff');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Barlow Condensed';src:url('fonts/barlow-condensed-SemiBold.woff') format('woff');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Barlow Condensed';src:url('fonts/barlow-condensed-Bold.woff') format('woff');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Figtree';src:url('fonts/figtree-var.woff') format('woff');font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:'DM Mono';src:url('fonts/dm-mono-Regular.woff') format('woff');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'DM Mono';src:url('fonts/dm-mono-Medium.woff') format('woff');font-weight:500;font-style:normal;font-display:swap}
</style>
</head>
<body>
<style>
/* Layout: a one-screen phone app. Header, one scrolling column, fixed tab bar.
   Plan editor and Settings are full-screen layers; pickers are bottom sheets.
   Orange appears only on the primary action, the active tab and selected values;
   green means "completed", muted mono text means "last time". */
:root {
  --bg:#f4ecdf; --surface:#fbf6ec; --surface2:#eadfce; --surface3:#dccfb8;
  --line:rgba(70,45,15,.14); --fg:#2a1d12; --fg2:#6a5842; --fg3:#8c795f;
  --accent:#c4500c; --accent-ink:#ffffff; --accent-soft:rgba(196,80,12,.13);
  --done:#1f8a4c; --done-soft:rgba(31,138,76,.14);
  --danger:#b4313b; --danger-soft:rgba(180,49,59,.11);
  --shadow:0 14px 40px rgba(60,35,10,.22);
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --f-data:'DM Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#141210; --surface:#1d1a17; --surface2:#27231f; --surface3:#332e29;
    --line:rgba(255,235,210,.09); --fg:#f6f0e8; --fg2:#b3a799; --fg3:#7f7366;
    --accent:#f4701f; --accent-ink:#1c0f05; --accent-soft:rgba(244,112,31,.17);
    --done:#62d68e; --done-soft:rgba(98,214,142,.14);
    --danger:#f0707a; --danger-soft:rgba(240,112,122,.13);
    --shadow:0 14px 40px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"] {
  --bg:#141210; --surface:#1d1a17; --surface2:#27231f; --surface3:#332e29;
  --line:rgba(255,235,210,.09); --fg:#f6f0e8; --fg2:#b3a799; --fg3:#7f7366;
  --accent:#f4701f; --accent-ink:#1c0f05; --accent-soft:rgba(244,112,31,.17);
  --done:#62d68e; --done-soft:rgba(98,214,142,.14);
  --danger:#f0707a; --danger-soft:rgba(240,112,122,.13);
  --shadow:0 14px 40px rgba(0,0,0,.55);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);
  -webkit-font-smoothing:antialiased;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 0 10px;flex-shrink:0}
.eyebrow{font:500 11px/1.2 var(--f-data);letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)}
h1{font:700 38px/1 var(--f-display);letter-spacing:.01em;text-transform:uppercase;margin-top:4px;text-wrap:balance}
h2{font:700 24px/1.05 var(--f-display);letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.top-btn{height:40px;min-width:40px;padding:0 14px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px}
.top-btn svg{width:20px;height:20px}
.main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px)}
.page{display:none}.page.on{display:block}
.sec{font:600 11px/1 var(--f-data);letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);margin:22px 0 10px}
.sec:first-child{margin-top:4px}
.muted{color:var(--fg2)}.small{font-size:12.5px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}.row>.grow{flex:1;min-width:0}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;background:var(--surface2);font-weight:600;font-size:15px;text-align:center;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.ghost{background:none;border:1px dashed var(--fg3);color:var(--fg2)}
.btn.sm{min-height:40px;width:auto;padding:0 14px;font-size:14px;border-radius:12px}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.45}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.nav-in{max-width:640px;margin:0 auto;display:flex;height:var(--nav-h)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--fg3);font:600 11px var(--f-body);position:relative}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--accent)}
.nav button.on::before{content:"";position:absolute;top:-7px;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

/* today: idle */
.hero{padding:20px 18px 18px}
.hero h2{font-size:34px;margin:6px 0 6px}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{min-height:44px;padding:0 16px;border-radius:12px;background:var(--surface2);font-weight:600;font-size:14.5px;display:flex;align-items:center}
.pill:active{background:var(--accent);color:var(--accent-ink)}
.plan-q{padding:14px 16px 16px}
.plan-q .nm{font:700 20px/1.1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}

/* today: active */
.prog{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 12px}
.prog-in{display:flex;align-items:center;gap:12px}
.prog-t{font:700 22px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.prog-bar{height:5px;border-radius:3px;background:var(--surface2);margin-top:8px;overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--done);border-radius:3px;transition:width .3s}

.ex{margin-bottom:12px;overflow:hidden}
.ex-h{display:flex;align-items:center;gap:8px;padding:12px 8px 12px 14px;width:100%}
.chev{width:18px;height:18px;stroke:var(--fg3);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s;flex-shrink:0}
.ex.open .chev{transform:rotate(90deg)}
.ex-name{font:700 21px/1.1 var(--f-display);letter-spacing:.015em;text-transform:uppercase;overflow-wrap:anywhere}
.ex-meta{font-size:12.5px;color:var(--fg2);margin-top:2px}
.ex-sum{font:400 12px var(--f-data);color:var(--fg2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-more{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--fg2);flex-shrink:0}
.ex-more svg{width:22px;height:22px;fill:currentColor}
.ex-body{display:none;padding:0 12px 14px}
.ex.open .ex-body{display:block}
.lasttxt{font-size:12px;color:var(--fg3);padding:0 2px 8px}
.sets{display:flex;flex-direction:column;gap:6px}
.shead,.srow{display:grid;grid-template-columns:34px 1fr 1fr 1fr 48px;gap:6px;align-items:center}
.sets.nw .shead,.sets.nw .srow{grid-template-columns:34px 1fr 1fr 48px}
.shead{font:500 10px var(--f-data);letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);padding:0 0 2px;text-align:center}
.shead span:first-child{text-align:left}
.snum{height:48px;border-radius:10px;font:500 14px var(--f-data);color:var(--fg2);display:flex;align-items:center;justify-content:center}
.prev{height:48px;border-radius:10px;font:400 13px var(--f-data);font-style:italic;color:var(--fg3);display:flex;align-items:center;justify-content:center;text-decoration:underline dotted;text-underline-offset:4px}
.prev.none{text-decoration:none}
.fld{height:48px;border-radius:12px;background:var(--surface2);border:1.5px dashed transparent;font:500 18px var(--f-data);text-align:center;display:flex;align-items:center;justify-content:center;color:var(--fg3);min-width:0}
.fld.has{background:var(--surface);border:1.5px solid var(--accent);color:var(--fg)}
.srow.done .fld{background:var(--done-soft);border-color:transparent;color:var(--fg)}
.srow.done .snum{color:var(--done)}
.chk{height:48px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center}
.chk svg{width:24px;height:24px;stroke:var(--fg3);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.srow.done .chk{background:var(--done)}
.srow.done .chk svg{stroke:#fff}
.ex-foot{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ex-foot .btn{flex:1;min-width:140px}
.badge{display:inline-flex;align-items:center;gap:4px;font:600 11px var(--f-body);padding:3px 8px;border-radius:20px;background:var(--surface2);color:var(--fg2)}
.badge.ok{background:var(--done-soft);color:var(--done)}

/* history */
.hs{margin-bottom:10px;overflow:hidden}
.hs-h{display:flex;gap:12px;align-items:center;padding:14px;width:100%}
.dot{width:10px;align-self:stretch;border-radius:5px;flex-shrink:0}
.hs-t{font:700 20px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.hs-d{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.hs.open .hs-d{display:block}
.hs.open .chev{transform:rotate(90deg)}
.hx{padding:10px 0;border-bottom:1px solid var(--line)}
.hx:last-of-type{border-bottom:none}
.hx-n{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:400 12.5px var(--f-data);background:var(--surface2);border-radius:8px;padding:4px 8px}

/* stats */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:14px 16px}
.tile b{display:block;font:700 40px/1 var(--f-display);color:var(--accent)}
.tile span{font-size:12.5px;color:var(--fg2)}
.list-btn{display:flex;align-items:center;gap:12px;padding:16px;width:100%}

/* sheets */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.3,.8,.3,1),visibility 0s .28s}
.sheet.on{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.3,.8,.3,1)}
.sheet-in{max-width:640px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--shadow);max-height:90vh;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;
  padding:8px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet-in::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--surface3);margin:4px auto 14px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.sh-x{height:36px;padding:0 12px;border-radius:10px;background:var(--surface2);font-weight:600;font-size:13px;color:var(--fg2);flex-shrink:0}
.hint{font-size:13px;color:var(--fg2);margin:4px 0 12px}
.sh-actions{display:flex;gap:10px;margin-top:16px}
.sh-actions.col{flex-direction:column}
.sh-actions .btn.sec2{flex:0 0 auto;width:auto}

.pv{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:6px 0 12px}
.pv-in{width:7ch;min-width:0;background:none;border:none;border-bottom:2px solid var(--accent);text-align:center;font:500 56px/1.1 var(--f-display);color:var(--fg);outline:none;border-radius:0}
.pv-unit{font:500 14px var(--f-data);color:var(--fg2)}
.stepper{display:flex;align-items:center;gap:8px}
.stp{width:52px;height:52px;border-radius:50%;background:var(--surface2);font:500 26px var(--f-body);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stp:active{background:var(--accent);color:var(--accent-ink)}
.strip{position:relative;flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;padding:4px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.opt{flex:0 0 auto;min-width:56px;height:52px;padding:0 6px;border-radius:12px;background:var(--surface2);font:500 17px var(--f-data);display:flex;align-items:center;justify-content:center}
.opt.sel{background:var(--accent);color:var(--accent-ink)}
.lastline{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--fg2)}

.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fg>label,.lbl{font:600 11px var(--f-data);letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;background:var(--surface2);border:1.5px solid transparent;font-size:16px;outline:none;appearance:none;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:84px;resize:vertical;font-family:var(--f-data);font-size:14px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--fg2) 50%),linear-gradient(135deg,var(--fg2) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:42px;border-radius:9px;font-weight:600;font-size:14px;text-align:center;color:var(--fg2)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

.ch-row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;min-height:52px}
.ch-row:last-child{border-bottom:none}
.ch-row .tag{margin-left:auto;font-size:12px;color:var(--fg3)}
.create-box{padding:12px;border-radius:14px;background:var(--accent-soft);margin-bottom:10px;display:flex;flex-direction:column;gap:8px}

/* layers */
.layer{position:fixed;inset:0;z-index:40;background:var(--bg);padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.layer-in{height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column}
.layer-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;flex-shrink:0}
.lt-title{font:700 21px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em;text-align:center;flex:1}
.lt-btn{min-width:72px;height:42px;padding:0 12px;border-radius:12px;font-weight:600;font-size:15px;color:var(--fg2)}
.lt-btn.pri{background:var(--accent);color:var(--accent-ink)}
.lt-btn[hidden]{visibility:hidden;display:block!important}
.layer-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}

.day{padding:14px;margin-bottom:12px}
.day-ex{display:flex;align-items:center;gap:6px;padding:4px 0}
.day-ex .nm{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.mini{width:40px;height:40px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--fg2);font-size:16px;flex-shrink:0}
.mini[disabled]{opacity:.3}
.mini.rm{color:var(--danger)}
.prof{display:flex;gap:8px;align-items:stretch;margin-bottom:8px}
.prof-main{flex:1;min-width:0;display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line)}
.prof-main.on{border-color:var(--accent)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--fg3);flex-shrink:0}
.prof-main.on .radio{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 18px);transform:translate(-50%,12px);z-index:80;background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
.undo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 18px);z-index:70;display:flex;align-items:center;gap:14px;background:var(--fg);color:var(--bg);padding:8px 8px 8px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);white-space:nowrap;max-width:calc(100vw - 32px)}
.undo button{height:40px;padding:0 16px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.bk-msg{font-size:13px;color:var(--danger);margin-top:10px;min-height:18px}
.empty{text-align:center;padding:30px 20px;color:var(--fg2)}
.warn{flex-shrink:0;margin:0 0 10px;padding:12px 14px;border-radius:14px;background:var(--danger-soft);border:1px solid var(--danger);display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.warn b{color:var(--danger);font-size:14.5px}
.warn-b{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
/* history, stats, charts */
.vseg{margin-bottom:14px;position:sticky;top:0;z-index:6;box-shadow:0 0 0 6px var(--bg)}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cal-h .mn{font:700 24px var(--f-display);text-transform:uppercase;letter-spacing:.03em;flex:1;text-align:center}
.cal-nav{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center}
.cal-nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cal-wd,.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-wd span{text-align:center;font:500 10px var(--f-data);letter-spacing:.06em;color:var(--fg3);padding:4px 0}
.cal-c{min-height:50px;border-radius:12px;background:var(--surface);border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:500 15px var(--f-data);color:var(--fg2);padding:4px 0}
.cal-c.blank{background:none;pointer-events:none}
.cal-c.has{background:var(--accent-soft);color:var(--fg)}
.cal-c.today{border-color:var(--accent);color:var(--accent);font-weight:700}
.cal-c.sel{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cal-dots{display:flex;gap:3px;height:6px}
.cal-dots i{width:6px;height:6px;border-radius:50%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 2px 0;font-size:12px;color:var(--fg2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.msum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.msum div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.msum b{display:block;font:700 22px/1 var(--f-display);color:var(--accent);white-space:nowrap}
.msum span{font-size:10.5px;color:var(--fg2)}
.badge{display:inline-block;font:600 10px var(--f-data);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);vertical-align:3px;margin-left:8px}
.emsum{padding:4px 0 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.hs-act{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.hs-act .btn{width:100%}
.edset{display:grid;grid-template-columns:34px 1fr 1fr 48px;gap:6px;align-items:center;margin-bottom:6px}
.edset.nw{grid-template-columns:34px 1fr 48px}
.rmset{display:flex;align-items:center;justify-content:center;height:48px;border-radius:12px;background:var(--surface2);color:var(--danger);font-size:18px;font-weight:700}
.rmset[disabled]{opacity:.3}
.chart{width:100%;height:auto;display:block;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart text{font:500 10px var(--f-data);fill:var(--fg3)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.chart .pt.sel{fill:var(--accent)}
.chart .bar{fill:var(--accent);opacity:.5}.chart .bar.cur{opacity:1}
.chart text.val{fill:var(--fg2)}
.readout{font:500 13px var(--f-data);text-align:center;padding:8px 6px;background:var(--surface2);border-radius:10px;margin:6px 0}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.rec b{font:700 24px/1.1 var(--f-display);color:var(--accent);overflow-wrap:anywhere}
.xrow{padding:12px 0;border-bottom:1px solid var(--line)}.xrow:last-child{border-bottom:none}
/* timers */
.clockpill{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:18px;background:var(--surface2);font:500 15px var(--f-data);flex-shrink:0}
.wc-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.restbar{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 8px 8px 12px;border-radius:14px;background:var(--surface2);flex-wrap:wrap}
.restbar .btn.sm{height:40px;padding:0 14px;width:auto;font-size:14px}
.rb-time{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:70px;min-height:44px;justify-content:center}
.rb-t{font:500 22px var(--f-data)}
.rb-prog{flex:1;min-width:40px;height:5px;border-radius:3px;background:var(--surface3);overflow:hidden}
.rb-prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .25s linear}
[data-st=done] .rb-t,[data-st=done] .fs-rt,[data-st=done] .rt-big{color:var(--done)}
[data-st=run] .rb-t,[data-st=run] .fs-rt{color:var(--accent)}
.rt-big{font:500 56px var(--f-data);text-align:center;margin:10px 0 2px}
.chiprow{display:flex;gap:8px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.chiprow .opt{min-width:62px;height:48px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.nstep{display:flex;align-items:center;gap:8px}
.nstep input{flex:1;min-width:0;text-align:center;font:500 22px var(--f-data)}
.fs{position:fixed;inset:0;z-index:50;background:var(--bg);padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
.fs-in{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;overflow-y:auto}
.fs-x{align-self:flex-end;height:44px;padding:0 14px;margin-top:8px;font-weight:600;color:var(--fg2)}
.fs-body{margin:auto 0;display:flex;flex-direction:column;gap:10px;padding:12px 0 24px;text-align:center}
.fs-big{font:500 72px/1 var(--f-data);margin:4px 0 18px}
.fs-rest{display:flex;flex-direction:column;gap:6px}
.fs-rt{font:500 64px/1.1 var(--f-data)}
.em-phase{font:600 26px var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin-top:6px}
.em-count{font:500 150px/1 var(--f-data);margin:10px 0}
.em-count.ready{color:var(--accent)}.em-count.low{color:var(--danger)}
.em-target{font:600 20px var(--f-body);margin-bottom:16px}
.em-done{min-height:96px;font-size:30px;font-family:var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.em-done:disabled{background:var(--done-soft);color:var(--done)}
.em-dots{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:18px 0 8px}
.em-dot{width:14px;height:14px;border-radius:50%;background:var(--surface3)}
.em-dot.pass{background:var(--fg3)}.em-dot.done{background:var(--done)}.em-dot.miss{background:var(--danger)}
.em-dot.cur{box-shadow:0 0 0 3px var(--accent-soft),0 0 0 5px var(--accent)}
.em-endb{margin-top:14px}
.em-row{display:flex;justify-content:space-between;padding:13px 4px;border-bottom:1px solid var(--line);font-size:16px}
.em-row b{font-family:var(--f-data);font-weight:500}
@media (max-height:520px){.em-count{font-size:84px;margin:2px 0}.fs-big{font-size:48px;margin:0 0 8px}.fs-rt{font-size:44px}.fs-body{gap:6px;padding:4px 0 12px}.sheet-in{max-height:96dvh}.nav{--nav-h:52px}}
@media (max-width:359px){.em-count{font-size:120px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

    perSide: !!def.perSide, notes: '', sets: [newSet(), newSet(), newSet()] };
}

}

    var sess = all[i];

/* ---- small SVG charts (no libraries) ---- */
function niceDomain(min, max) {
  var span = max - min;
  if (span <= 0) { span = Math.max(1, Math.abs(max) * 0.2); min -= span / 2; max += span / 2; span = max - min; }

var chartPts = [];   // points of the line chart currently on screen
function lineChart(pts, aria) {
  var W = 320, H = 190, L = 46, R = 14, T = 12, B = 26, iw = W - L - R, ih = H - T - B;
  var ys = pts.map(function (p) { return p.y; }), dom = niceDomain(Math.min.apply(null, ys), Math.max.apply(null, ys));
  var sy = function (v) { return T + ih - (v - dom.lo) / (dom.hi - dom.lo) * ih; };

  chartPts = pts.map(function (p, i) { return L + (t1 > t0 ? (p.t - t0) / (t1 - t0) : i / Math.max(1, pts.length - 1)) * iw; });
  var g = '', d = '';

    var y = sy(v).toFixed(1);
    g += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (L - 6) + '" y="' + (+y + 3.5) + '" text-anchor="end">' + (v >= 10000 ? fmtBig(v) : fmtW(v)) + '</text>';
  });
  pts.forEach(function (p, i) { d += (i ? 'L' : 'M') + chartPts[i].toFixed(1) + ' ' + sy(p.y).toFixed(1); });
  var dots = pts.map(function (p, i) {
    return '<circle class="pt' + (i === pts.length - 1 ? ' sel' : '') + '" data-i="' + i + '" cx="' + chartPts[i].toFixed(1) + '" cy="' + sy(p.y).toFixed(1) + '" r="5"/>';

  return '<svg class="chart" data-chart viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(aria) + '">' + g +
    '<path class="ln" d="' + d + '"/>' + dots +
    '<text x="' + L + '" y="' + (H - 6) + '" text-anchor="start">' + sd(pts[0].date) + '</text>' +
    (pts.length > 1 ? '<text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">' + sd(pts[pts.length - 1].date) + '</text>' : '') + '</svg>';
}
function barChart(vals, labels, cur, aria) {
